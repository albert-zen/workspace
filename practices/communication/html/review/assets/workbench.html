  <nav class="command-bar" id="command-bar" aria-label="工作台视图">
    <button class="brand-button" id="show-problems" type="button">
      <span class="brand-mark" id="brand-mark">W</span>
      <span id="command-title">问题</span>
    </button>
    <div class="command-context" id="command-context"></div>
    <div class="command-actions">
      <button class="command-button" id="toggle-report" type="button" aria-pressed="false"><svg class="octicon" aria-hidden="true"><use href="#octicon-info"></use></svg><span>信息</span></button>
      <button class="command-button review-only" id="toggle-issue" type="button" aria-pressed="true"><svg class="octicon" aria-hidden="true"><use href="#octicon-issue"></use></svg><span>问题说明</span></button>
      <button class="command-button review-only" id="toggle-files" type="button" aria-pressed="true"><svg class="octicon" aria-hidden="true"><use href="#octicon-file"></use></svg><span>文件</span></button>
      <button class="command-button review-only" id="toggle-inspector" type="button" aria-pressed="true"><svg class="octicon" aria-hidden="true"><use href="#octicon-comment"></use></svg><span>批注</span></button>
      <button class="command-button review-only" id="enter-zen" type="button"><svg class="octicon" aria-hidden="true"><use href="#octicon-screen-full"></use></svg><span>Zen</span></button>
      <button class="icon-button" id="collapse-command" type="button" aria-label="收起工具栏"><svg class="octicon" aria-hidden="true"><use href="#octicon-chevron-up"></use></svg></button>
    </div>
  </nav>
  <button class="restore-command" id="restore-command" type="button">展开工具</button>
  <button class="review-back-to-problems" id="review-back-to-problems" type="button"><svg class="octicon" aria-hidden="true"><use href="#octicon-arrow-left"></use></svg><span>问题总览</span></button>

  <header class="report-header" id="review-header"></header>

  <main id="main-content">
    <section class="overview-screen" id="overview-screen" aria-labelledby="problem-map-title">
      <div class="problem-map">
        <header class="problem-map-heading"><h1 id="problem-map-title" tabindex="-1">问题总览</h1><p>选择一个问题，核对对应文件与实际改动。</p></header>
        <div class="problem-branches" id="problem-list" aria-label="问题列表"></div>
      </div>
      <aside class="problem-preview" id="problem-preview" aria-live="polite"></aside>
    </section>

    <section class="review-screen" id="review-screen" hidden>
      <section class="issue-strip" id="issue-strip">
        <div class="issue-strip-copy" id="issue-strip-copy"></div>
        <button class="icon-button" id="collapse-issue" type="button" aria-label="收起问题说明"><svg class="octicon" aria-hidden="true"><use href="#octicon-chevron-up"></use></svg></button>
      </section>
      <button class="context-restore" id="restore-issue" type="button"><span>显示问题说明</span><svg class="octicon" aria-hidden="true"><use href="#octicon-chevron-down"></use></svg></button>

      <div class="workbench" id="workbench">
        <button class="edge-restore edge-restore-files" id="restore-files" type="button"><span>文件</span><svg class="octicon" aria-hidden="true"><use href="#octicon-chevron-right"></use></svg></button>
        <aside class="files-panel" id="files-panel" aria-label="变更文件">
          <div class="panel-heading">
            <div><p class="eyebrow">Changed files</p><h2>文件</h2></div>
            <div class="panel-heading-actions">
              <span id="file-count" class="count-badge"></span>
              <button class="icon-button panel-collapse" id="collapse-files" type="button" aria-label="收起文件栏"><svg class="octicon" aria-hidden="true"><use href="#octicon-chevron-left"></use></svg></button>
            </div>
          </div>
          <nav id="file-list" class="file-list" aria-label="切换源文件"></nav>
        </aside>

        <section class="review-panel" id="review-surface" tabindex="-1">
          <div class="review-toolbar">
            <div class="file-identity"><span id="file-status" class="file-status"></span><strong id="current-path" class="current-path"></strong></div>
            <div class="toolbar-actions">
              <div id="view-switcher" class="segmented" aria-label="审阅视图"></div>
              <button class="quiet-button compact-button" id="edit-toggle" type="button">编辑源文件</button>
              <button class="quiet-button compact-button" id="accept-file" type="button"></button>
            </div>
          </div>
          <div id="file-intent" class="file-intent"></div>
          <div id="content-surface" class="content-surface" aria-live="polite"></div>
        </section>

        <aside class="inspector-panel" id="inspector-panel" aria-label="改动依据与批注">
          <div class="inspector-collapse-row">
            <button class="icon-button panel-collapse" id="collapse-inspector" type="button" aria-label="收起批注栏"><svg class="octicon" aria-hidden="true"><use href="#octicon-chevron-right"></use></svg></button>
          </div>
          <section id="context-panel" class="inspector-section"></section>
          <section class="inspector-section annotations-section">
            <div class="section-heading compact">
              <div><p class="eyebrow">Annotation</p><h2>针对这段改</h2></div>
              <span class="count-badge" id="comment-count">0</span>
            </div>
            <div id="anchor-preview" class="anchor-preview"></div>
            <form id="comment-form" class="comment-form">
              <label for="comment-body">批注意见</label>
              <textarea id="comment-body" rows="3" placeholder="先点一行，或选中一句话，再写希望怎么改"></textarea>
              <button class="secondary-button" type="submit">添加批注</button>
            </form>
            <div id="comment-list" class="comment-list"></div>
          </section>
        </aside>
        <button class="edge-restore edge-restore-inspector" id="restore-inspector" type="button"><svg class="octicon" aria-hidden="true"><use href="#octicon-chevron-left"></use></svg><span>批注</span></button>
      </div>
    </section>
  </main>

  <footer class="action-bar" id="action-bar" aria-label="审阅操作">
    <div class="review-state" id="review-state"></div>
    <div class="action-group">
      <button class="quiet-button" id="download-patch" type="button"><svg class="octicon" aria-hidden="true"><use href="#octicon-download"></use></svg><span>下载 Patch</span></button>
      <button class="secondary-button" id="copy-feedback" type="button"><svg class="octicon" aria-hidden="true"><use href="#octicon-copy"></use></svg><span>复制反馈</span></button>
      <button class="primary-button" id="prepare-apply" type="button"><svg class="octicon" aria-hidden="true"><use href="#octicon-check-circle"></use></svg><span>准备应用</span></button>
    </div>
  </footer>

  <button class="zen-exit" id="zen-exit" type="button">退出 Zen</button>

  <dialog id="apply-dialog" class="apply-dialog" aria-labelledby="apply-title">
    <form method="dialog"><button class="dialog-close" aria-label="关闭" value="cancel"><svg class="octicon" aria-hidden="true"><use href="#octicon-x"></use></svg></button></form>
    <p class="eyebrow">Explicit adapter handoff</p>
    <h2 id="apply-title">准备交给 Agent 应用</h2>
    <p>HTML 不会直接写回工作空间。下载响应包后，由 Agent 先检查目标是否 stale，再显式应用。</p>
    <div id="apply-preview" class="apply-preview"></div>
    <div class="dialog-actions">
      <button class="secondary-button" id="download-response" type="button">下载响应包</button>
      <button class="primary-button" id="copy-apply-command" type="button">复制应用说明</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript-note">核心内容仍可阅读；问题预览、切换视图、编辑、批注和导出需要 JavaScript。</div>__WORKBENCH_FALLBACK__</noscript>
  <script id="review-data" type="application/json">__WORKBENCH_DATA__</script>
  <script>__WORKBENCH_JS__</script>
</body>
</html>
